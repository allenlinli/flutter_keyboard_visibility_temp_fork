include: package:lints/recommended.yaml

analyzer:
  exclude:
    - "**.mocks.dart"

linter:
  rules:
    # Disable rules for generated code
    no_leading_underscores_for_library_prefixes: false
    # Allow private types in public API for keyboard visibility provider
    library_private_types_in_public_api: false
    # Allow leading underscores in test parameter names
    no_leading_underscores_for_local_identifiers: false
