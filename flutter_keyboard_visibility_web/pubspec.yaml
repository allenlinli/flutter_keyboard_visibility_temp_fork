name: flutter_keyboard_visibility_web_allenlinli
description: A fork of flutter_keyboard_visibility_web that's compatible with Flutter/WASM and flutter_keyboard_visibility
version: 2.0.1
homepage: https://github.com/allenlinli/flutter_keyboard_visibility_temp_fork
repository: https://github.com/allenlinli/flutter_keyboard_visibility_temp_fork

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

flutter:
  plugin:
    implements: flutter_keyboard_visibility
    platforms:
      web:
        pluginClass: FlutterKeyboardVisibilityPluginWeb
        fileName: flutter_keyboard_visibility_web_allenlinli.dart

dependencies:
  flutter_keyboard_visibility_platform_interface: ^2.0.0
  flutter_web_plugins:
    sdk: flutter
  flutter:
    sdk: flutter
  web: ">=0.5.1 <2.0.0"

dev_dependencies:
  lints: ^5.0.0
  flutter_test:
    sdk: flutter
